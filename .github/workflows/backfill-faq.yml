# .github/workflows/backfill-faq.yml
#
# Backfill FAQ — auto-stop friendly, riprendibile
# Stop dopo 5h per evitare kill GitHub Actions a 6h.

name: Backfill FAQ

on:
  workflow_dispatch:
    inputs:
      target_total:
        description: "Numero totale chat da processare (es. 10000)"
        required: false
        default: "10000"
      limit_per_call:
        description: "Chat per chiamata (raccomandato 25)"
        required: false
        default: "25"
      max_iterations:
        description: "Numero max chiamate (default 400)"
        required: false
        default: "400"
      max_runtime_minutes:
        description: "Auto-stop dopo N minuti (default 300 = 5h)"
        required: false
        default: "300"
      max_error_pct:
        description: "Stop se error rate >= X% (default 20)"
        required: false
        default: "20"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Backfill loop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TARGET_TOTAL: ${{ inputs.target_total }}
          LIMIT_PER_CALL: ${{ inputs.limit_per_call }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
          MAX_ERROR_PCT: ${{ inputs.max_error_pct }}
        run: |
          echo "═══════════════════════════════════════"
          echo "  BACKFILL FAQ"
          echo "═══════════════════════════════════════"
          echo "Target totale:        $TARGET_TOTAL chat"
          echo "Limit per call:       $LIMIT_PER_CALL"
          echo "Max iterations:       $MAX_ITERATIONS"
          echo "Max runtime:          ${MAX_RUNTIME_MINUTES}m"
          echo "Max error rate:       ${MAX_ERROR_PCT}%"
          echo "Started at:           $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          TOTAL_PROCESSED=0
          TOTAL_TOKENS_CLAUDE=0
          TOTAL_TOKENS_OPENAI=0
          TOTAL_ERRORS=0
          ITERATIONS=0
          START_TS=$(date +%s)
          MAX_RUNTIME_SECONDS=$(( MAX_RUNTIME_MINUTES * 60 ))
          STOP_REASON=""

          while [ $ITERATIONS -lt $MAX_ITERATIONS ] && [ $TOTAL_PROCESSED -lt $TARGET_TOTAL ]; do
            ELAPSED=$(( $(date +%s) - START_TS ))
            if [ $ELAPSED -ge $MAX_RUNTIME_SECONDS ]; then
              STOP_REASON="MAX_RUNTIME ($(($ELAPSED / 60))min)"
              echo ""
              echo "⏱️  Auto-stop: $STOP_REASON"
              break
            fi

            ITERATIONS=$((ITERATIONS + 1))
            ITER_START=$(date +%s)

            echo "──────────────────────────────────────"
            echo "▶ Iter $ITERATIONS/$MAX_ITERATIONS | processati: $TOTAL_PROCESSED/$TARGET_TOTAL | runtime: $(($ELAPSED / 60))m"

            HTTP_CODE=$(curl --silent --show-error \
              --max-time 600 \
              --write-out "%{http_code}" \
              --output /tmp/faq_response.json \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              "$SUPABASE_URL/functions/v1/process-faq-batch?limit=$LIMIT_PER_CALL")

            ITER_ELAPSED=$(( $(date +%s) - ITER_START ))

            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "❌ HTTP $HTTP_CODE — Response:"
              cat /tmp/faq_response.json
              echo ""
              if [ "$HTTP_CODE" = "546" ] || [ "$HTTP_CODE" = "504" ] || [ "$HTTP_CODE" = "503" ]; then
                echo "⏸️  Errore temporaneo: aspetto 30s e ritento..."
                sleep 30
                continue
              fi
              STOP_REASON="HTTP_ERROR $HTTP_CODE"
              break
            fi

            CANDIDATES=$(jq -r '.stats.candidates // 0' /tmp/faq_response.json)
            PROCESSED=$(jq -r '.stats.processed // 0' /tmp/faq_response.json)
            TOKENS_C=$(jq -r '.stats.tokens_claude // 0' /tmp/faq_response.json)
            TOKENS_O=$(jq -r '.stats.tokens_openai // 0' /tmp/faq_response.json)
            ERRORS=$(jq -r '.stats.errors | length' /tmp/faq_response.json)
            MESSAGE=$(jq -r '.message // ""' /tmp/faq_response.json)

            TOTAL_PROCESSED=$((TOTAL_PROCESSED + PROCESSED))
            TOTAL_TOKENS_CLAUDE=$((TOTAL_TOKENS_CLAUDE + TOKENS_C))
            TOTAL_TOKENS_OPENAI=$((TOTAL_TOKENS_OPENAI + TOKENS_O))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))

            echo "   ↳ $MESSAGE"
            echo "   ↳ cand: $CANDIDATES | proc: $PROCESSED | err: $ERRORS | t: ${ITER_ELAPSED}s"
            echo "   ↳ TOT: chat=$TOTAL_PROCESSED, tok_c=$TOTAL_TOKENS_CLAUDE, tok_o=$TOTAL_TOKENS_OPENAI, err=$TOTAL_ERRORS"

            if [ "$CANDIDATES" -eq 0 ]; then
              STOP_REASON="COMPLETE (no more pending)"
              echo ""
              echo "🎉 Nessuna chat pending. Backfill completato!"
              break
            fi

            if [ "$PROCESSED" -eq 0 ] && [ "$CANDIDATES" -gt 0 ]; then
              STOP_REASON="ALL_FAILED (candidates but 0 processed)"
              echo ""
              echo "⚠️  $CANDIDATES candidati ma 0 processati — stop."
              break
            fi

            if [ $TOTAL_PROCESSED -ge 50 ]; then
              ERROR_PCT=$(( TOTAL_ERRORS * 100 / (TOTAL_PROCESSED + TOTAL_ERRORS) ))
              if [ $ERROR_PCT -ge $MAX_ERROR_PCT ]; then
                STOP_REASON="HIGH_ERROR_RATE (${ERROR_PCT}%)"
                echo ""
                echo "⚠️  Error rate alto: ${ERROR_PCT}% — stop."
                break
              fi
            fi

            sleep 10
          done

          if [ -z "$STOP_REASON" ]; then
            STOP_REASON="LIMIT_REACHED"
          fi

          TOTAL_ELAPSED=$(( $(date +%s) - START_TS ))
          CLAUDE_COST=$(echo "scale=4; ($TOTAL_TOKENS_CLAUDE * 0.8 * 1.0 + $TOTAL_TOKENS_CLAUDE * 0.2 * 5.0) / 1000000" | bc 2>/dev/null || echo "0")
          OPENAI_COST=$(echo "scale=4; $TOTAL_TOKENS_OPENAI * 0.02 / 1000000" | bc 2>/dev/null || echo "0")

          echo ""
          echo "═══════════════════════════════════════"
          echo "  RIEPILOGO BACKFILL FAQ"
          echo "═══════════════════════════════════════"
          echo "Stop reason:          $STOP_REASON"
          echo "Iterazioni:           $ITERATIONS"
          echo "Chat processate:      $TOTAL_PROCESSED"
          echo "Errori:               $TOTAL_ERRORS"
          echo "Tokens Claude:        $TOTAL_TOKENS_CLAUDE"
          echo "Tokens OpenAI:        $TOTAL_TOKENS_OPENAI"
          echo "Costo Claude (stim):  \$$CLAUDE_COST"
          echo "Costo OpenAI (stim):  \$$OPENAI_COST"
          echo "Tempo totale:         ${TOTAL_ELAPSED}s ($(($TOTAL_ELAPSED / 60))m $(($TOTAL_ELAPSED % 60))s)"
          echo "Finished at:          $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          
          if [[ "$STOP_REASON" == *"MAX_RUNTIME"* ]] || [[ "$STOP_REASON" == *"LIMIT_REACHED"* ]]; then
            echo "💡 SUGGERIMENTO: rilancia questo workflow per continuare dal punto attuale."
          fi
