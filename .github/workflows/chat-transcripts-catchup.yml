# Scopo: smaltire l'arretrato di chat senza transcript, lanciando
# zoho-sync-chat-transcripts ripetutamente finché non ne restano più
# (o finché non si raggiunge il numero massimo di batch previsto per
# questa esecuzione).
#
# Da lanciare PRIMA di "Chat Categorization Catch-up": la
# categorizzazione salta le chat senza transcript, quindi finché
# questo arretrato non è smaltito, il catch-up della categorizzazione
# non ha lavoro da fare su quelle chat.
#
# Non è schedulato: va lanciato a mano da Actions → Chat Transcripts
# Catch-up → Run workflow, quando serve.

name: Chat Transcripts Catch-up

on:
  workflow_dispatch:
    inputs:
      max_batches:
        description: "Numero massimo di batch da 100 chat da processare in questa esecuzione (ogni batch impiega ~1-2 minuti)"
        required: false
        default: "20"

jobs:
  catchup:
    runs-on: ubuntu-latest
    # 20 batch x ~2 min + pause = margine ampio entro il limite di 6h di GitHub Actions
    timeout-minutes: 90

    steps:
      - name: Smaltisci arretrato transcript
        run: |
          MAX_BATCHES="${{ github.event.inputs.max_batches }}"
          echo "Eseguo fino a $MAX_BATCHES batch da 100 chat ciascuno..."

          for i in $(seq 1 "$MAX_BATCHES"); do
            echo ""
            echo "=== Batch $i di $MAX_BATCHES ==="

            RESPONSE=$(curl -sS -X POST \
              "${{ secrets.SUPABASE_URL }}/functions/v1/zoho-sync-chat-transcripts?max=100" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Content-Type: application/json")

            echo "$RESPONSE"

            # Se la funzione segnala che non c'è più nulla da processare
            # (risposta osservata: {"ok": true, "done": true, "message":
            # "Nessuna chat da processare..."}), ci fermiamo qui invece
            # di continuare a chiamarla a vuoto.
            if echo "$RESPONSE" | grep -q '"done"[[:space:]]*:[[:space:]]*true'; then
              echo ""
              echo "✅ Arretrato transcript smaltito completamente dopo $i batch — interrompo il ciclo."
              exit 0
            fi

            # Anche "remaining": 0 nella risposta normale indica fine arretrato
            if echo "$RESPONSE" | grep -q '"remaining"[[:space:]]*:[[:space:]]*0'; then
              echo ""
              echo "✅ Nessuna chat rimanente (remaining: 0) dopo $i batch — interrompo il ciclo."
              exit 0
            fi

            # Pausa tra un batch e l'altro per non sovraccaricare le API
            # Zoho con chiamate troppo ravvicinate.
            sleep 20
          done

          echo ""
          echo "Raggiunto il limite di $MAX_BATCHES batch per questa esecuzione."
          echo "Se restano ancora chat senza transcript, rilancia il workflow."
