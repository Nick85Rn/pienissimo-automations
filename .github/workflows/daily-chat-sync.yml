# .github/workflows/daily-chat-sync.yml
#
# Daily Chat Sync — automazione giornaliera
# ─────────────────────────────────────────────
#
# COSA FA (ogni giorno alle 05:00 UTC = 07:00 IT in inverno):
#   1. 3 batch sync transcripts (zoho-sync-chat-transcripts)
#   2. 3 batch categorizzazione AI (llm-categorize-chats?limit=100&since_year=2026)
#   Capacità totale: ~300 chat/giorno
#
# TRIGGER:
#   - Automatico: cron giornaliero 05:00 UTC
#   - Manuale: Actions → Daily Chat Sync → Run workflow
# ─────────────────────────────────────────────

name: Daily Chat Sync

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── Transcripts (3 batch) ─────────────────
      - name: Sync transcripts batch 1
        run: |
          curl -sS -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/zoho-sync-chat-transcripts" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
          echo ""

      - name: Sleep 30s
        run: sleep 30

      - name: Sync transcripts batch 2
        run: |
          curl -sS -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/zoho-sync-chat-transcripts" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
          echo ""

      - name: Sleep 30s
        run: sleep 30

      - name: Sync transcripts batch 3
        run: |
          curl -sS -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/zoho-sync-chat-transcripts" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
          echo ""

      # ─── Categorizzazione AI (3 batch) ─────────
      - name: Categorize chats batch 1
        run: |
          curl -sS -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/llm-categorize-chats?limit=100&since_year=2026" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
          echo ""

      - name: Sleep 30s
        run: sleep 30

      - name: Categorize chats batch 2
        run: |
          curl -sS -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/llm-categorize-chats?limit=100&since_year=2026" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
          echo ""

      - name: Sleep 30s
        run: sleep 30

      - name: Categorize chats batch 3
        run: |
          curl -sS -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/llm-categorize-chats?limit=100&since_year=2026" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
          echo ""
