# Scopo: smaltire l'arretrato di locali senza coordinate geografiche,
# lanciando geocode-locali ripetutamente finché non ne restano più (o
# finché non si raggiunge il numero massimo di batch previsto per
# questa esecuzione).
#
# Batch da 25 locali (non 90): con 1.1s di pausa tra una richiesta e
# l'altra (limite Nominatim: 1 richiesta al secondo), un batch da 90
# supera i ~100s di esecuzione e va oltre il limite di durata massima
# di una singola Edge Function Supabase (errore WORKER_RESOURCE_LIMIT,
# riscontrato in pratica). Con batch da 25 (~30s a chiamata) si resta
# ampiamente sotto soglia; si compensa con più batch in sequenza.
#
# Non è possibile accelerare il rate limit sottostante (1 richiesta al
# secondo) senza passare a un provider di geocoding a pagamento: è una
# policy di utilizzo di Nominatim/OpenStreetMap, non un parametro
# configurabile lato nostro.
#
# I clienti DISDETTO sono già esclusi direttamente dalla funzione
# geocode-locali (vedi codice della funzione): questo workflow smaltisce
# quindi solo i locali che contano davvero per la mappa installazioni.
#
# Non è schedulato: va lanciato a mano da Actions → Geocode Locali
# Catch-up → Run workflow, quando serve.

name: Geocode Locali Catch-up

on:
  workflow_dispatch:
    inputs:
      max_batches:
        description: "Numero massimo di batch da 25 locali da processare in questa esecuzione (ogni batch impiega ~30s)"
        required: false
        default: "100"

jobs:
  catchup:
    runs-on: ubuntu-latest
    # 100 batch x ~35s (30s chiamata + margine + pausa) = ~58 min,
    # ampio margine entro il limite di 6h di GitHub Actions
    timeout-minutes: 90

    steps:
      - name: Smaltisci arretrato geocoding
        run: |
          MAX_BATCHES="${{ github.event.inputs.max_batches }}"
          BATCH_SIZE=25
          echo "Eseguo fino a $MAX_BATCHES batch da $BATCH_SIZE locali ciascuno (~30s/batch)..."

          for i in $(seq 1 "$MAX_BATCHES"); do
            echo ""
            echo "=== Batch $i di $MAX_BATCHES ==="

            RESPONSE=$(curl -sS -X POST \
              "${{ secrets.SUPABASE_URL }}/functions/v1/geocode-locali?limit=$BATCH_SIZE" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Content-Type: application/json")

            echo "$RESPONSE"

            # Quando la coda è esaurita, la funzione processa meno record
            # del limite richiesto (processed < BATCH_SIZE) — segno che
            # non ci sono più candidati e possiamo fermarci.
            PROCESSED=$(echo "$RESPONSE" | grep -o '"processed"[[:space:]]*:[[:space:]]*[0-9]*' | grep -o '[0-9]*$')

            if [ -n "$PROCESSED" ] && [ "$PROCESSED" -lt "$BATCH_SIZE" ]; then
              echo ""
              echo "✅ Coda esaurita (processati $PROCESSED su $BATCH_SIZE attesi) dopo $i batch — interrompo il ciclo."
              exit 0
            fi

            # Se la funzione ha risposto con un errore (es. resource
            # limit) invece che con "processed", ci fermiamo per evitare
            # di ripetere lo stesso errore a vuoto per tutti i batch
            # rimanenti.
            if echo "$RESPONSE" | grep -q '"code"[[:space:]]*:'; then
              echo ""
              echo "⚠️ Risposta con errore invece che con risultato — interrompo il ciclo per revisione manuale."
              exit 1
            fi

            # Pausa breve tra un batch e l'altro, oltre al rate limit
            # già rispettato internamente dalla funzione stessa.
            sleep 5
          done

          echo ""
          echo "Raggiunto il limite di $MAX_BATCHES batch per questa esecuzione."
          echo "Se restano ancora locali da geocodificare, rilancia il workflow."
