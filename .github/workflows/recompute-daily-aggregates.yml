# .github/workflows/recompute-daily-aggregates.yml
#
# Recompute degli aggregati daily Pienissimo
# Chiama l'Edge Function run-recompute-all che bypassa il timeout PostgREST.
# Gira 3 volte al giorno per tenere la dashboard sempre fresca.

name: Recompute Daily Aggregates

on:
  schedule:
    # 07:00 UTC = 09:00 it estate (apertura uffici)
    # 13:00 UTC = 15:00 it estate (dopo pranzo)
    # 19:00 UTC = 21:00 it estate (fine giornata)
    - cron: '0 7,13,19 * * *'
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call run-recompute-all Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "═══════════════════════════════════════"
          echo "  RECOMPUTE DAILY AGGREGATES"
          echo "═══════════════════════════════════════"
          echo "Started at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          HTTP_CODE=$(curl --silent --show-error \
            --max-time 180 \
            --write-out "%{http_code}" \
            --output /tmp/response.json \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/functions/v1/run-recompute-all")

          echo "HTTP Status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/response.json | jq . || cat /tmp/response.json
          echo ""

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "═══════════════════════════════════════"
            echo "  ✅ Tutti i recompute completati con successo"
            echo "═══════════════════════════════════════"
          elif [ "$HTTP_CODE" -eq 207 ]; then
            echo "═══════════════════════════════════════"
            echo "  ⚠️  Alcuni recompute hanno fallito (Multi-Status)"
            echo "═══════════════════════════════════════"
            exit 1
          else
            echo "═══════════════════════════════════════"
            echo "  ❌ Errore: HTTP $HTTP_CODE"
            echo "═══════════════════════════════════════"
            exit 1
          fi

          echo "Finished at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
