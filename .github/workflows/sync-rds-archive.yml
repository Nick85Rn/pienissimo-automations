name: Sync Supabase → RDS Archive

on:
  schedule:
    # Ogni notte alle 05:30 UTC = 06:30/07:30 ora italiana
    # Dopo il daily-chat-sync che gira alle 05:00 UTC
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  sync-rds:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

- name: Install dependencies
        run: |
          npm init -y > /dev/null
          npm pkg set type=module
          npm install --silent pg @supabase/supabase-js

      - name: Run sync Supabase → RDS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_DATABASE: ${{ secrets.RDS_DATABASE }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
        run: node scripts/sync-supabase-to-rds.js
