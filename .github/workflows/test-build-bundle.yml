name: Test Build Bundle

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call build-faq-bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "▶ Calling build-faq-bundle..."
          
          HTTP_CODE=$(curl --silent --show-error \
            --max-time 60 \
            --write-out "%{http_code}" \
            --output /tmp/bundle.json \
            -D /tmp/headers.txt \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/functions/v1/build-faq-bundle?format=full")
          
          echo "HTTP Status: $HTTP_CODE"
          echo ""
          echo "Response headers:"
          cat /tmp/headers.txt | grep -i "^x-\|^content-type\|^cache-control"
          echo ""
          echo "Bundle size: $(wc -c < /tmp/bundle.json) bytes"
          echo "Compressed (gzip): $(gzip -c /tmp/bundle.json | wc -c) bytes"
          echo ""
          echo "First-level keys:"
          jq 'keys' /tmp/bundle.json
          echo ""
          echo "FAQ stats:"
          jq '.faqs.stats' /tmp/bundle.json
          echo ""
          echo "Search index documents count:"
          jq '.index.documents | length' /tmp/bundle.json
          echo ""
          echo "Sample FAQ (first):"
          jq '.faqs.faqs[0]' /tmp/bundle.json
